<!DOCTYPE html> 
<html lang="es"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Calculadora | Grados</title>
        <link rel="stylesheet" href="css/ejercicio9.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head> 
    
    <body>
        <div class="contenedor-formulario">
        <h1>Calculadora</h1>
        <p class="subtitulo">Grados Celsius a Fahrenheit</p>

        <form class="formulario" id="formulario">
            <div class="grupo-formulario">
                <label for="grados">Ingrese los grados Celsius</label>
                <input type="number" id="grados" placeholder="Ej. 25">
            </div>

            <div class="grupo-formulario">
                <label for="resultado">Grados Fahrenheit</label>
                <input type="text" id="resultado" placeholder="Resultado" readonly>
            </div>

            <button type="submit" class="boton-enviar">
                Convertir <span> → </span>
            </button>
    </form>
</div>

<script src="js/ejercicio10.js"></script>

</body> </html>
